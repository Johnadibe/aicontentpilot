version: "3.8"

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
    restart: always
    ports:
      - "3034:3000"
    env_file:
      - .env.staging
    environment:
      - BACKEND_URL=http://backend:8000
      - DATABASE_URL=${DATABASE_URL}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
    networks:
      - aicontentpilot-staging-network
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aicontentpilot_staging
    volumes:
      - postgres_data_staging:/var/lib/postgresql/data
    networks:
      - aicontentpilot-staging-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aicontentpilot_staging"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data_staging:
    name: aicontentpilot_postgres_data_staging

networks:
  aicontentpilot-staging-network:
    name: aicontentpilot-staging-network
    external: true
