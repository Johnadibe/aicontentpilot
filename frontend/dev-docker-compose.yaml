version: "3.8"

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    env_file:
      - .env.dev
    environment:
      - BACKEND_URL=http://backend:8000
      - DATABASE_URL=${DATABASE_URL}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
    command: npm run dev
    networks:
      - aicontentpilot-dev-network
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aicontentpilot_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - aicontentpilot-dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aicontentpilot_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data_dev:
    name: aicontentpilot_postgres_data_dev

networks:
  aicontentpilot-dev-network:
    name: aicontentpilot-dev-network
