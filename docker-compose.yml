version: "3.8"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8000
      - DATABASE_URL=${DATABASE_URL}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
    networks:
      - aicontentpilot-network
    depends_on:
      - backend
      - db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8000:8000"
    environment:
      - FRONTEND_URL=http://frontend:3000
      - DATABASE_URL=${DATABASE_URL}
    networks:
      - aicontentpilot-network
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aicontentpilot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aicontentpilot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aicontentpilot"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: aicontentpilot_postgres_data

networks:
  aicontentpilot-network:
    name: aicontentpilot-network
