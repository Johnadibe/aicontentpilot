version: "3.8"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3010:3000"
    environment:
      - POSTGRES_URL=${POSTGRES_URL}
      - BACKEND_URL=http://backend:8000
      - STRIPE_SECRET=${STRIPE_SECRET}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_BASIC_PRICE_ID=${STRIPE_BASIC_PRICE_ID}
      - STRIPE_PREMIUM_PRICE_ID=${STRIPE_PREMIUM_PRICE_ID}
      - APP_URL=${APP_URL}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3010}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3010}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - BACKEND_SECRET_KEY=${SECRET_KEY}
      - SECRET_KEY=${SECRET_KEY}
    volumes:
      - frontend-data:/app/.next/cache
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - aipen-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3011:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=HS256
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3010}
      - DATABASE_URL=${POSTGRES_URL}
      - deepseek_api_key=${deepseek_api_key}
      - deepseek_api_base=${deepseek_api_base}
    volumes:
      - backend-data:/app/data
    restart: unless-stopped
    networks:
      - aipen-network

volumes:
  frontend-data:
  backend-data:

networks:
  aipen-network:
    name: aipen-network
