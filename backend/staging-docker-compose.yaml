version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env.staging
    environment:
      - FRONTEND_URL=http://frontend:3000
      - DATABASE_URL=${POSTGRES_URL}
    networks:
      - aicontentpilot-staging-network
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aicontentpilot_staging
    volumes:
      - postgres_data_staging:/var/lib/postgresql/data
    networks:
      - aicontentpilot-staging-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aicontentpilot_staging"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data_staging:
    name: aicontentpilot_postgres_data_staging

networks:
  aicontentpilot-staging-network:
    name: aicontentpilot-staging-network
    external: true
