version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env.dev
    environment:
      - FRONTEND_URL=http://frontend:3000
      - DATABASE_URL=${POSTGRES_URL}
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - aicontentpilot-dev-network
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aicontentpilot_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - aicontentpilot-dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aicontentpilot_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data_dev:
    name: aicontentpilot_postgres_data_dev

networks:
  aicontentpilot-dev-network:
    name: aicontentpilot-dev-network
